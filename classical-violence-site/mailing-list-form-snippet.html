<!--
  Classical Violence — "Join the list" form for trianglerockproductions.com
  Paste where the sign-up should appear (under "We're raising funds and building our team...").
  Replace PASTE_WEB_APP_URL_HERE with the Web app URL from your Apps Script deployment.
  Fonts used: Archivo (title) + Inter (body), loaded below.
-->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,900&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<div id="signup" class="cv-signup">
  <div class="cv-checker" aria-hidden="true"></div>
  <div class="cv-body">
    <form id="cv-signup-form" novalidate>
      <div>
        <h3>Join the list</h3>
        <p class="cv-sub">Get production updates, casting calls and premiere news by email.</p>
      </div>

      <div class="cv-row">
        <label>Name
          <input type="text" name="name" autocomplete="name" placeholder="Your name">
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
      </div>

      <label>I’m interested as
        <select name="interest">
          <option value="Supporter">A supporter / fan</option>
          <option value="Investor">An investor</option>
          <option value="Partner">A partner or sponsor</option>
          <option value="Cast">Cast</option>
          <option value="Crew">Crew</option>
        </select>
      </label>

      <!-- spam trap: hidden from people -->
      <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" class="cv-hp">
      <input type="hidden" name="source" value="Classical Violence page">

      <button type="submit">Join the list</button>
      <p class="cv-note" id="cv-msg" role="status">No spam. Unsubscribe anytime.</p>
    </form>

    <div id="cv-thanks" class="cv-thanks" hidden role="status">
      <h3>You’re on the list.</h3>
      <p>Thanks for signing up. We’ll keep you posted on the road to the ring.</p>
    </div>
  </div>
</div>

<style>
  .cv-signup{--red:#B5120E;max-width:640px;margin:44px auto 0;background:#141416;border:1px solid #3A3733;text-align:left;font-family:Inter,system-ui,sans-serif;color:#EDEAE4}
  .cv-checker{height:12px;background:repeating-conic-gradient(#EDEAE4 0 25%,#0B0B0C 0 50%) 0 0/12px 12px}
  .cv-body{padding:clamp(24px,4vw,36px)}
  .cv-signup form{display:flex;flex-direction:column;gap:18px}
  .cv-signup h3{margin:0;font-family:Archivo,'Arial Black',sans-serif;font-stretch:125%;font-weight:900;font-size:28px;line-height:1.1;text-transform:uppercase;color:var(--red)}
  .cv-sub{margin:8px 0 0;font-size:16px;color:#C9C4BC}
  .cv-row{display:flex;flex-wrap:wrap;gap:16px}
  .cv-row label{flex:1 1 220px}
  .cv-signup label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#C9C4BC}
  .cv-signup input,.cv-signup select{min-height:48px;padding:0 14px;border:1px solid #5A5650;background:#0B0B0C;color:#EDEAE4;font:16px Inter,system-ui,sans-serif;letter-spacing:0;text-transform:none}
  .cv-signup button{min-height:52px;border:0;background:var(--red);color:#fff;font:600 15px Inter,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
  .cv-signup button[disabled]{opacity:.6;cursor:wait}
  .cv-note{margin:0;font-size:13px;color:#A39E95}
  .cv-thanks{display:flex;flex-direction:column;gap:8px;padding:8px 0}
  .cv-thanks p{margin:0;font-size:16px;color:#C9C4BC}
  .cv-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>

<script>
  (function () {
    var SCRIPT_URL = 'PASTE_WEB_APP_URL_HERE';
    var form = document.getElementById('cv-signup-form');
    var msg = document.getElementById('cv-msg');
    var thanks = document.getElementById('cv-thanks');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var email = form.email.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.textContent = 'Please enter a valid email address.';
        form.email.focus();
        return;
      }
      var btn = form.querySelector('button');
      btn.disabled = true; btn.textContent = 'Joining…';

      fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: new FormData(form) })
        .then(function () {
          form.hidden = true;
          thanks.hidden = false;
        })
        .catch(function () {
          btn.disabled = false; btn.textContent = 'Join the list';
          msg.textContent = 'Something went wrong. Please try again, or email trianglerockproductions@gmail.com.';
        });
    });
  })();
</script>
